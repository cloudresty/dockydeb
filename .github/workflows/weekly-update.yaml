name: Weekly Update

# This CI workflow runs weekly on the main branch (due to GitHub Actions limitations)
# but checks out and updates the develop branch when updates are detected.
# The auto-merge-to-main workflow will then handle merging to main and releasing.

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC (runs on default branch: main)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: cloudresty/dockydeb

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      updates-available: ${{ steps.check.outputs.updates_available }}
      update-summary: ${{ steps.check.outputs.update_summary }}
      should-update: ${{ steps.decide.outputs.should_update }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check for updates
      id: check
      run: |
        echo "Running update detection script..."
        chmod +x scripts/check-updates.sh
        ./scripts/check-updates.sh

    - name: Decide if update is needed
      id: decide
      run: |
        updates_available="${{ steps.check.outputs.updates_available }}"
        force_update="${{ github.event.inputs.force_update }}"

        if [[ "$updates_available" == "true" ]] || [[ "$force_update" == "true" ]]; then
          echo "should_update=true" >> $GITHUB_OUTPUT
          echo "Update needed: updates_available=$updates_available, force_update=$force_update"
        else
          echo "should_update=false" >> $GITHUB_OUTPUT
          echo "No update needed: updates_available=$updates_available, force_update=$force_update"
        fi

  update-version:
    runs-on: ubuntu-latest
    needs: [check-updates]
    if: needs.check-updates.outputs.should-update == 'true'
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      version-changed: ${{ steps.version.outputs.version-changed }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Get current version
      id: current-version
      run: |
        current_version=$(grep "DOCKYDEB_VERSION=" version.env | cut -d'=' -f2)
        echo "current-version=${current_version}" >> $GITHUB_OUTPUT
        echo "Current version: ${current_version}"

    - name: Generate new version
      id: version
      run: |
        current_version="${{ steps.current-version.outputs.current-version }}"
        # Remove 'v' prefix if present
        version_number=${current_version#v}

        # Split version into parts (assuming semver x.y.z)
        IFS='.' read -r major minor patch <<< "$version_number"

        # Increment patch version
        new_patch=$((patch + 1))
        new_version="v${major}.${minor}.${new_patch}"

        echo "new-version=${new_version}" >> $GITHUB_OUTPUT
        echo "New version: ${new_version}"

        # Always mark as changed since we only get here if updates are available
        echo "version-changed=true" >> $GITHUB_OUTPUT

    - name: Update version.env
      run: |
        new_version="${{ steps.version.outputs.new-version }}"
        echo "DOCKYDEB_VERSION=${new_version}" > version.env
        echo "Updated version.env to ${new_version}"

    - name: Update Dockerfile version labels
      run: |
        new_version="${{ steps.version.outputs.new-version }}"
        version_number=${new_version#v}

        # Update the version and revision labels in Dockerfile
        sed -i "s/org\.opencontainers\.image\.version=\"[^\"]*\"/org.opencontainers.image.version=\"${version_number}\"/g" Dockerfile
        sed -i "s/org\.opencontainers\.image\.revision=\"[^\"]*\"/org.opencontainers.image.revision=\"${version_number}\"/g" Dockerfile

        echo "Updated Dockerfile labels to ${version_number}"

    - name: Commit version changes
      run: |
        new_version="${{ steps.version.outputs.new-version }}"
        update_summary="${{ needs.check-updates.outputs.update-summary }}"

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add version.env Dockerfile package-versions.json

        # Create detailed commit message
        git commit -m "chore: bump version to ${new_version} [automated]

        Updates detected:
        ${update_summary}" || exit 0
        git push origin develop

  docker-build-test:
    runs-on: ubuntu-latest
    needs: [check-updates, update-version]
    if: needs.check-updates.outputs.should-update == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract version from version.env
      id: version
      run: |
        version=$(grep "DOCKYDEB_VERSION=" version.env | cut -d'=' -f2)
        version_number=${version#v}
        echo "version=${version}" >> $GITHUB_OUTPUT
        echo "version-number=${version_number}" >> $GITHUB_OUTPUT
        echo "Building version: ${version}"

    - name: Build Docker image (test)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: |
          ${{ env.IMAGE_NAME }}:test
          ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Test Docker image
      run: |
        echo "Testing basic container functionality..."
        docker run --rm ${{ env.IMAGE_NAME }}:test zsh --version
        docker run --rm ${{ env.IMAGE_NAME }}:test curl --version
        docker run --rm ${{ env.IMAGE_NAME }}:test git --version
        echo "All basic tests passed!"

  update-success:
    runs-on: ubuntu-latest
    needs: [check-updates, update-version, docker-build-test]
    if: needs.check-updates.outputs.should-update == 'true' && success()

    steps:
    - name: Success notification
      run: |
        echo "Weekly DockyDEB update completed successfully!"
        echo "Triggered by: ${{ github.event_name }}"
        echo "Container build: PASSED"
        echo "Version update: UPDATED to ${{ needs.update-version.outputs.new-version }}"
        echo ""
        echo "Update summary:"
        echo "${{ needs.check-updates.outputs.update-summary }}"
        echo ""
        echo "Changes pushed to develop branch!"
        echo "The auto-merge-to-main workflow will now:"
        echo "1. Validate the changes"
        echo "2. Merge develop to main"
        echo "3. Trigger the auto-release workflow"
        echo "4. Build and push Docker images"
        echo "5. Create GitHub release"

  no-updates:
    runs-on: ubuntu-latest
    needs: [check-updates]
    if: needs.check-updates.outputs.should-update == 'false'

    steps:
    - name: No updates notification
      run: |
        echo "No updates detected for DockyDEB container."
        echo "Triggered by: ${{ github.event_name }}"
        echo "All components are up to date:"
        echo "- Base image: debian:bookworm-slim"
        echo "- Package versions"
        echo "- Git repositories (Oh My Zsh, themes, plugins)"
        echo ""
        echo "No action needed - container is current."
