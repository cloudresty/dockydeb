name: Weekly Update

# One workflow does the whole job: measure the image, decide whether anything
# actually changed, and if so publish, bump, merge, tag and release.
#
# It is deliberately NOT split into separate workflows chained by push events.
# The default GITHUB_TOKEN cannot trigger another workflow run, so a chain like
# that stops silently at the first hop — which is how this pipeline published
# nothing for six months while reporting success every week.

on:
  schedule:
    # Sunday 02:00 UTC. Scheduled runs always execute the copy of this file on
    # the default branch, so edits here take effect only once merged to main.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Publish even when the image is unchanged'
        required: false
        default: false
        type: boolean
      release_type:
        description: 'Which part of the version to increment'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: dockydeb-release
  cancel-in-progress: false

env:
  IMAGE_NAME: cloudresty/dockydeb

jobs:
  update:
    name: Check, Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch main and tags
        run: git fetch --tags --prune origin main develop

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.CLR__DOCKER_HUB_USERNAME }}
          password: ${{ secrets.CLR__DOCKER_HUB_PAT }}

      # No cache and a fresh base image pull. A cached build would reproduce
      # last week's packages and the fingerprint would never move.
      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:candidate

      - name: Test candidate image
        run: |
          echo "Testing candidate container..."
          docker run --rm "${IMAGE_NAME}:candidate" zsh --version
          docker run --rm "${IMAGE_NAME}:candidate" curl --version
          docker run --rm "${IMAGE_NAME}:candidate" git --version
          docker run --rm "${IMAGE_NAME}:candidate" jq --version
          docker run --rm "${IMAGE_NAME}:candidate" bash -c \
            'command -v dig && command -v ping && command -v netstat'
          docker run --rm "${IMAGE_NAME}:candidate" test -d /root/.oh-my-zsh
          docker run --rm "${IMAGE_NAME}:candidate" test -f /etc/update-motd.d/20-welcome
          docker run --rm "${IMAGE_NAME}:candidate" zsh -c 'echo "shell ok"'
          echo "Candidate image passed functional tests."

      - name: Fingerprint the image
        id: fingerprint
        run: |
          previous="$(jq -r '.fingerprint // ""' package-versions.json)"
          current="$(scripts/image-fingerprint.sh \
            "${IMAGE_NAME}:candidate" "${RUNNER_TEMP}/fingerprint.json")"

          {
            echo "previous=${previous}"
            echo "current=${current}"
          } >> "$GITHUB_OUTPUT"

          echo "Previous fingerprint: ${previous:-<none recorded>}"
          echo "Current fingerprint:  ${current}"

      - name: Decide whether to publish
        id: decide
        run: |
          previous="${{ steps.fingerprint.outputs.previous }}"
          current="${{ steps.fingerprint.outputs.current }}"
          forced="${{ inputs.force_update }}"

          if [[ "$previous" != "$current" ]]; then
            publish=true
            reason="the container contents changed"
          elif [[ "$forced" == "true" ]]; then
            publish=true
            reason="the container is unchanged, but a publish was forced manually"
          else
            publish=false
            reason="the container is identical to the published version"
          fi

          {
            echo "publish=${publish}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

          echo "Decision: publish=${publish} — ${reason}"

      - name: Determine next version
        id: version
        if: steps.decide.outputs.publish == 'true'
        run: |
          current="$(grep '^DOCKYDEB_VERSION=' version.env | cut -d'=' -f2)"
          IFS='.' read -r major minor patch <<< "${current#v}"

          case "${{ inputs.release_type || 'patch' }}" in
            major) major=$(( major + 1 )); minor=0; patch=0 ;;
            minor) minor=$(( minor + 1 )); patch=0 ;;
            *)     patch=$(( patch + 1 )) ;;
          esac

          next="v${major}.${minor}.${patch}"

          # Never reuse a version that already has a tag.
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::Tag ${next} already exists — refusing to reuse a version."
            exit 1
          fi

          {
            echo "current=${current}"
            echo "next=${next}"
            echo "number=${major}.${minor}.${patch}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${current} → ${next}"

      - name: Apply version and record fingerprint
        if: steps.decide.outputs.publish == 'true'
        run: |
          number="${{ steps.version.outputs.number }}"

          scripts/fingerprint-diff.sh \
            package-versions.json \
            "${RUNNER_TEMP}/fingerprint.json" \
            > "${RUNNER_TEMP}/component-changes.md"
          cat "${RUNNER_TEMP}/component-changes.md"

          echo "DOCKYDEB_VERSION=${{ steps.version.outputs.next }}" > version.env
          sed -i "s/org\.opencontainers\.image\.version=\"[^\"]*\"/org.opencontainers.image.version=\"${number}\"/" Dockerfile
          sed -i "s/org\.opencontainers\.image\.revision=\"[^\"]*\"/org.opencontainers.image.revision=\"${number}\"/" Dockerfile
          cp "${RUNNER_TEMP}/fingerprint.json" package-versions.json

      # Published before any git mutation on purpose: if the push fails,
      # nothing has been committed, tagged or released, and the next run
      # retries from a clean state.
      - name: Build and push release image
        if: steps.decide.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.next }}

      - name: Verify the published image
        if: steps.decide.outputs.publish == 'true'
        run: |
          next="${{ steps.version.outputs.next }}"

          echo "Published manifest for ${next}:"
          docker buildx imagetools inspect "${IMAGE_NAME}:${next}"

          platforms="$(docker buildx imagetools inspect "${IMAGE_NAME}:${next}" \
            --format '{{ json .Manifest }}' \
            | jq -r '[ (.manifests // [])[]
                       | select(.platform.os != "unknown")
                       | "\(.platform.os)/\(.platform.architecture)" ] | join(" ")')"

          echo "Platforms in the published manifest: ${platforms}"

          for required in linux/amd64 linux/arm64; do
            if [[ " ${platforms} " != *" ${required} "* ]]; then
              echo "::error::Published manifest is missing ${required}"
              exit 1
            fi
          done

          echo "Running the published arm64 image under emulation..."
          docker run --rm --platform linux/arm64 "${IMAGE_NAME}:${next}" zsh --version

          echo "Published image verified on linux/amd64 and linux/arm64."

      - name: Commit, merge, tag and release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          next="${{ steps.version.outputs.next }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          {
            echo "chore: release ${next} [automated]"
            echo
            echo "Published cloudresty/dockydeb:${next} for linux/amd64 and linux/arm64."
            echo
            echo "Component changes:"
            cat "${RUNNER_TEMP}/component-changes.md"
          } > "${RUNNER_TEMP}/commit-message.txt"

          git add version.env Dockerfile package-versions.json
          git commit --file "${RUNNER_TEMP}/commit-message.txt"
          git push origin develop

          # Bring main up to the state that was just published.
          git checkout -B main origin/main
          git merge --no-ff origin/develop -m "chore: release ${next}"
          git push origin main

          git tag -a "${next}" -m "DockyDEB ${next}"
          git push origin "${next}"

          {
            echo "## DockyDEB ${next}"
            echo
            echo "Automated weekly rebuild — published because ${{ steps.decide.outputs.reason }}."
            echo
            echo "### Component changes"
            echo
            cat "${RUNNER_TEMP}/component-changes.md"
            echo
            echo "### Usage"
            echo
            echo '```bash'
            echo "docker pull cloudresty/dockydeb:${next}"
            echo "docker pull cloudresty/dockydeb:latest"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } > "${RUNNER_TEMP}/release-notes.md"

          gh release create "${next}" \
            --title "DockyDEB ${next}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --target main

      - name: Summary
        if: always() && steps.decide.outcome == 'success'
        run: |
          {
            echo "## DockyDEB Weekly Update"
            echo
            echo "**Decision**: ${{ steps.decide.outputs.reason }}"
            echo "**Fingerprint**: \`${{ steps.fingerprint.outputs.current }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.decide.outputs.publish }}" == "true" ]]; then
            {
              echo "**Released**: ${{ steps.version.outputs.next }}"
              echo "**Platforms**: linux/amd64, linux/arm64"
              echo
              echo "### Component changes"
              echo
              cat "${RUNNER_TEMP}/component-changes.md"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "**Released**: nothing — no new version was needed"
              echo
              echo "The published image already matches what a fresh build produces."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
